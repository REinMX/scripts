# Public anonymized template. Copy this file to mbal_config.local.yaml and
# keep real paths, tank names, priors, and results out of Git.
#
# Dry run:
#   python mbal.py --config mbal_config.local.yaml --dry-run --n 200
# Licensed Windows run:
#   python mbal.py --config mbal_config.local.yaml --n 200

mbal_file: C:\Work\Models\three_tank_model.mbi
tag_mode: name
n_realizations: 200
seed: 42
sampling: lhs
out_dir: mbal_output

# Prediction controls. Empty lists disable their sweeps.
gas_lift_values: []
water_inj_control: rate_with_bhp_limit
water_inj_rate_values: []
water_inj_bhp_values: []

# official_stoiip is required. If P90 and P10 are omitted, the tank is fixed.
# If both are supplied, official_stoiip is the P50. Tanks are sampled
# independently and stoiip_total is their row-wise sum.
tanks:
  - key: A
    name: REPLACE_WITH_TANK_A_NAME
    index: 0
    result_index: 1
    p90_stoiip: 3.5
    official_stoiip: 4.5
    p10_stoiip: 5.5
  - key: B
    name: REPLACE_WITH_TANK_B_NAME
    index: 1
    result_index: 2
    official_stoiip: 3.0
  - key: C
    name: REPLACE_WITH_TANK_C_NAME
    index: 2
    result_index: 3
    p90_stoiip: 5.0
    official_stoiip: 6.5
    p10_stoiip: 8.0

# Default OpenServer tags are built in. Add a tags: mapping only when an
# access string differs in your installed MBAL version; copy it with
# Ctrl+Right-click rather than guessing.