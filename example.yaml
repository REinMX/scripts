#     value: 0
#   - name: pred_watinj
#     tag: MBAL.MB[0].PREDINP.WATINJ
#     value: "YES"

# Default OpenServer tags for tanks and results are built in. Add a tags:
# mapping only when an access string differs in your installed MBAL version.
