# Public anonymized template. Copy this file to mbal_config.local.yaml and
# keep real paths, tank names, tags, priors, and results out of Git.
#
# Dry run:
#   python mbal.py --config mbal_config.local.yaml --dry-run --n 200
# Licensed Windows run (MBAL must already be open):
#   python mbal.py --config mbal_config.local.yaml --n 200

mbal_file: C:\Work\Models\three_tank_model.mbi
tag_mode: name
n_realizations: 200
seed: 42
sampling: lhs
out_dir: mbal_output

# MBAL must already be running; OpenServer attaches to it and cannot start it.
# Leave this false so MBAL stays open for the next run.
close_mbal_on_finish: false

# official_stoiip is required and is the P50.
# Omit p90_stoiip/p10_stoiip to hold a tank FIXED at official_stoiip: that
# tank's P90, P50, P10 and mean will all be equal, and so will any result
# that depends only on it. Supply both to give it spread; asymmetric ranges
# are reproduced exactly and the reported mean will sit above official.
# Add "in_model: false" to drop a tank completely - it is then not sampled,
# not written to MBAL and not counted in stoiip_total.
# Unknown keys are rejected, so a misspelled p90_stoiip fails loudly.
tanks:
  - key: A
    name: REPLACE_WITH_TANK_A_NAME
    index: 0
    result_index: 1
    p90_stoiip: 3.5
    official_stoiip: 4.5
    p10_stoiip: 5.5
  - key: B
    name: REPLACE_WITH_TANK_B_NAME
    index: 1
    result_index: 2
    official_stoiip: 3.0
  - key: C
    name: REPLACE_WITH_TANK_C_NAME
    index: 2
    result_index: 3
    p90_stoiip: 5.0
    official_stoiip: 6.5
    p10_stoiip: 8.0

# Anything written into MBAL before each prediction: gas lift, injection
# rates, constraints, anything else with an OpenServer access string.
# Each entry needs a name, a tag, and either:
#   value:  a constant, written unchanged in every realization
#   values: a list to sweep, paired against every volume realization and
#           given its own <name>_sensitivity.csv
# Copy each tag from MBAL with Ctrl+Right-click; do not guess it.
controls: []
