# Example config for probabilistic_mbal_openserver_gas_lift.py
#   python probabilistic_mbal_openserver_gas_lift.py \
#       --config example_gas_lift_config.yaml --dry-run

mbal_file: C:\Work\Models\two_tank_model.mbi
tag_mode: name
n_realizations: 200
seed: 42
sampling: lhs
out_dir: mbal_gas_lift_output
out_csv: mbal_gas_lift_results.csv
validate_tags: true
log_level: INFO

gas_lift_well: REPLACE_WITH_GAS_LIFT_WELL_NAME
gas_lift_prediction_index: 1
gas_lift_values: [0.0, 0.5, 1.0, 1.5]

unit_stoiip: MMstb
unit_press: psig
unit_cum: MMstb

tanks:
  - key: bottom
    name: REPLACE_WITH_BOTTOM_TANK_NAME
    index: 0
    stoiip:
      kind: lognormal
      p90: 20.0
      p10: 70.0
    # aquifer_volume:
    #   kind: uniform
    #   low: 50.0
    #   high: 200.0

  - key: top
    name: REPLACE_WITH_TOP_TANK_NAME
    index: 1
    stoiip:
      kind: triangular
      low: 15.0
      mode: 45.0
      high: 90.0

tags:
  tank_stoiip: MBAL.MB[0].TANK[{tank}].OOIP
  aquifer_volume: MBAL.MB[0].TANK[{tank}].AQUIFVOLUME
  gas_lift_rate: MBAL.MB[0].PREDWELL[{well}][{p}].GASLIFTRATE
  cmd_open: 'MBAL.OPENFILE("{path}")'
  cmd_run_pred: MBAL.MB[0].PREDICTION.CALCULATE
  cmd_close: MBAL.SHUTDOWN
  res_nsteps: MBAL.MB[0].PREDICTION.RESULTS[{i}].COUNT
  res_cumoil: 'MBAL.MB[0].PREDICTION.RESULTS[{i}][{k}].CUMOIL("{u}")'
  res_pressure: 'MBAL.MB[0].PREDICTION.RESULTS[{i}][{k}].PRESSURE("{u}")'
  res_cumwat: 'MBAL.MB[0].PREDICTION.RESULTS[{i}][{k}].CUMWATER("{u}")'
