# Public anonymized template. Copy to simple.local.yaml (gitignored) and put
# the real model path, tank names, well names and numbers there.
#
#   python mbal_simple.py simple.local.yaml --show      # tags only, no MBAL
#   python mbal_simple.py simple.local.yaml --check     # model inputs vs here
#   python mbal_simple.py simple.local.yaml --match     # official run vs here

mbal_file: C:\Work\Models\model.mbi

# What MBAL should answer in. Leave a line out and MBAL uses the model's
# current unit set, which is the usual reason Python and the GUI disagree.
units: {}
# units:
#   stoiip: MMstb
#   cum_oil: MMstb
#   pressure: psia

# Per tank. stoiip is required; the other two are written only if given.
#   stoiip               -> TANK[{name}].OOIP
#   aquifer_volume       -> TANK[{name}].AQUIF.VOLUME
#   rock_compressibility -> TANK[{name}].ROCKCOMPRESS
tanks:
  - name: REPLACE_WITH_TOP_TANK
    stoiip: 4.5
  - name: REPLACE_WITH_BOTTOM_TANK
    stoiip: 3.0

# Anything else written before the prediction: gas lift, injector limits,
# well PIs. Copy each tag from MBAL with Ctrl+Right-click; do not guess.
# Leave this empty for the first --match, so only tank inputs can differ.
controls: []
# controls:
#   - name: gas_lift
#     tag: MBAL.MB[0].PREDWELL[{PRODUCER}].GASLIFTRATE
#     value: 0.5
#   - name: winj_max_bhp
#     tag: MBAL.MB[0].PREDWELL[{INJECTOR}].CONSTFBHP
#     value: 4500
#   - name: winj_max_rate
#     tag: MBAL.MB[0].PREDWELL[{INJECTOR}].CONSTRAINTS.MAXRATE
#     value: 3000

# One field-level prediction stream. The trailing [k] on a variable is the
# row, i.e. the time step; COUNT gives how many rows there are, and the last
# step is COUNT-1. read: is name -> MBAL variable, written verbatim.
results:
  stream: MBAL.MB[0].TRES[{Prediction}][{Prediction}]
  read:
    date: TIME
    cum_oil: CUMOIL
    cum_gas: CUMGAS
    cum_wat: CUMWAT
    res_pres: RESPRESS
    oil_rate: OILRATE
    wat_inj_rate: WATINJRATE
    gas_lift_rate: GASLIFTRATE
  profile: false        # true also writes every time step to profile_*.csv

out_dir: simple_output
tolerance_pct: 0.1
